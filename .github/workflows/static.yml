      `).join('');
    };

    const renderTeam = () => {
      document.getElementById('team-container').innerHTML = DATA.team.map((t, i) => `
        <div class="reveal from-bottom reveal-delay-${(i%4)+1} bg-gray-50 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl border border-gray-100 group transition-all duration-500 hover:-translate-y-2">
          <div class="relative aspect-[4/5] overflow-hidden bg-gray-200">
            <img src="${t.img}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </div>
          <div class="p-8 text-center bg-white relative -mt-6 mx-4 rounded-2xl shadow-lg group-hover:-translate-y-4 transition-transform duration-500 border border-gray-100">
            <h3 class="text-xl font-heading font-extrabold text-gray-900 mb-1">${t.name}</h3>
            <p class="text-primary font-bold text-sm mb-4 uppercase tracking-wider">${t.role}</p>
            <p class="text-gray-500 font-medium text-sm leading-relaxed">${t.desc}</p>
          </div>
        </div>
      `).join('');
    };

    const renderTestimonials = () => {
      document.getElementById('testimonials-grid').innerHTML = DATA.reviews.map((r, i) => `
        <div class="reveal blur-in reveal-delay-${(i%3)+1} bg-white border border-gray-100 shadow-xl p-10 rounded-3xl hover:shadow-2xl transition-all duration-500 relative hover:-translate-y-2 group">
          <i data-lucide="quote" class="absolute top-8 right-8 w-12 h-12 text-primary/10"></i>
          <div class="flex gap-1 mb-6 text-yellow-400">
            <i data-lucide="star" class="w-5 h-5 fill-current"></i><i data-lucide="star" class="w-5 h-5 fill-current"></i><i data-lucide="star" class="w-5 h-5 fill-current"></i><i data-lucide="star" class="w-5 h-5 fill-current"></i><i data-lucide="star" class="w-5 h-5 fill-current"></i>
          </div>
          <p class="text-gray-700 font-medium text-lg italic mb-8 relative z-10 leading-relaxed">"${r.text}"</p>
          <div class="flex items-center gap-4 border-t border-gray-100 pt-6">
            <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-lg">${r.author.charAt(0)}</div>
            <h5 class="text-gray-900 font-bold font-heading">${r.author}</h5>
          </div>
        </div>
      `).join('');
    };

    const renderSectors = () => {
      document.getElementById('sectors-grid').innerHTML = DATA.sectors.map((s, i) => `
        <div class="reveal zoom-in reveal-delay-${(i%6)+1} group p-6 rounded-2xl bg-gray-50 border border-gray-100 flex flex-col items-center justify-center text-center hover:bg-white hover:shadow-xl hover:border-primary/20 transition-all duration-500 hover:-translate-y-2">
          <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-500 mb-4 group-hover:scale-110 group-hover:text-primary transition-all duration-300">
            <i data-lucide="${s.icon}" class="w-6 h-6"></i>
          </div>
          <h4 class="font-bold font-heading text-sm text-gray-800">${s.title}</h4>
        </div>
      `).join('');
    };

    renderServices();
    renderProcess();
    renderPortfolio();
    renderGallery();
    renderTeam();
    renderTestimonials();
    renderSectors();
    lucide.createIcons();

    // INTERSECTION OBSERVER & ANIMATIONS (CountUp)
    let observerEnabled = true;
    const initObserver = () => {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { 
          if(e.isIntersecting) { 
            e.target.classList.add('active'); 
            
            const counters = e.target.querySelectorAll('.counter');
            if(counters.length > 0) {
              counters.forEach(counter => {
                let start = null;
                const target = +counter.getAttribute('data-target');
                const prefix = counter.getAttribute('data-prefix') || '';
                const suffix = counter.getAttribute('data-suffix') || '';
                const duration = 2000;
                
                const step = (timestamp) => {
                  if (!start) start = timestamp;
                  const progress = Math.min((timestamp - start) / duration, 1);
                  const easeOut = 1 - Math.pow(1 - progress, 3);
                  const currentCount = Math.floor(easeOut * target);
                  counter.innerText = prefix + currentCount + suffix;
                  if (progress < 1) {
                    window.requestAnimationFrame(step);
                  } else {
                    counter.innerText = prefix + target + suffix;
                  }
                };
                window.requestAnimationFrame(step);
              });
              counters.forEach(c => c.classList.remove('counter'));
            }
            obs.unobserve(e.target); 
          } 
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      
      document.querySelectorAll('.reveal:not(.active)').forEach(el => obs.observe(el));
      
      const statsContainer = document.getElementById('stats-container');
      if(statsContainer && !statsContainer.classList.contains('active')) {
         obs.observe(statsContainer);
      }
    };

    const clearActiveReveals = () => {
      document.querySelectorAll('.reveal.active').forEach(el => {
        el.classList.remove('active');
        // Let the CSS transition reset it down
      });
      // We don't want to reset CountUp if they've already animated.
    };

    function router() {
      const hash = window.location.hash || '#/home';
      document.querySelectorAll('.view').forEach(v => {
        v.classList.remove('active');
        v.style.display = 'none';
      });
      
      const routePath = hash.split('/')[1] || 'home';
      const separatePages = ['galeri', 'kadromuz', 'iletisim'];
      
      // Setup the view first
      const toggleView = (viewId) => {
         const view = document.getElementById(viewId);
         if(view) {
           view.style.display = 'block';
           void view.offsetWidth; 
           view.classList.add('active');
         }
      }

      if (separatePages.includes(routePath)) {
        clearActiveReveals();
        toggleView(`view-${routePath}`);
        window.scrollTo(0, 0);
        setTimeout(initObserver, 100);
      } else {
        const isHomePageActive = document.getElementById('view-home').classList.contains('active');
        if (!isHomePageActive) {
            clearActiveReveals();
        }
        toggleView('view-home');
        
        if (routePath && routePath !== 'home') {
          setTimeout(() => {
            const target = document.getElementById(routePath);
            if (target) {
              window.scrollTo({ 
                top: target.offsetTop - document.getElementById('navbar').offsetHeight, 
                behavior: 'smooth' 
              });
            }
          }, 100);
        } else {
          window.scrollTo(0, 0);
        }
        if (!isHomePageActive) {
           setTimeout(initObserver, 100);
        }
      }
      
      const mobileMenu = document.getElementById('mobile-menu');
      if(!mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
          document.getElementById('menu-icon').classList.remove('hidden');
          document.getElementById('close-icon').classList.add('hidden');
      }
    }
    
    window.addEventListener('hashchange', router);
    document.addEventListener("DOMContentLoaded", () => { 
      router(); 
      initObserver();
    });

    function openVideo(url) { 
      document.getElementById('yt-iframe').src = url; 
      const modal = document.getElementById('video-modal');
      modal.classList.remove('hidden'); 
      modal.classList.add('flex'); 
      setTimeout(() => modal.querySelector('.reveal').classList.add('active'), 100);
      document.body.style.overflow = 'hidden';
    }
    function closeVideo() { 
      document.getElementById('yt-iframe').src = ''; 
      const modal = document.getElementById('video-modal');
      modal.querySelector('.reveal').classList.remove('active');
      setTimeout(() => {
        modal.classList.add('hidden'); 
        modal.classList.remove('flex');  
        document.body.style.overflow = '';
      }, 400); // Wait for transition
    }
    function openImage(url) { 
      document.getElementById('lightbox-img').src = url; 
      const modal = document.getElementById('image-modal');
      modal.classList.remove('hidden'); 
      modal.classList.add('flex'); 
      setTimeout(() => modal.querySelector('.reveal').classList.add('active'), 100);
      document.body.style.overflow = 'hidden';
    }
    function closeImage() { 
      const modal = document.getElementById('image-modal');
      modal.querySelector('.reveal').classList.remove('active');
      setTimeout(() => {
        modal.classList.add('hidden'); 
        modal.classList.remove('flex'); 
        document.body.style.overflow = '';
      }, 400); // Wait for transition
    }

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    const closeIcon = document.getElementById('close-icon');

    mobileBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      if(mobileMenu.classList.contains('hidden')) {
        menuIcon.classList.remove('hidden');
        closeIcon.classList.add('hidden');
      } else {
        menuIcon.classList.add('hidden');
        closeIcon.classList.remove('hidden');
      }
    });

    // İletişim Formu Gönderimi
    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        const statusDiv = document.getElementById('form-status');
        const originalBtnText = submitBtn.innerHTML;
        
        // YÜKLENİYOR DURUMU
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Gönderiliyor...';
        submitBtn.disabled = true;
        lucide.createIcons();
        statusDiv.classList.add('hidden');
        statusDiv.classList.remove('bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');

        try {
          // ÖNEMLİ: Kendi e-postanıza bildirim gelmesi için Formspree URL'nizi buraya yapıştırın.
          // Örnek: 'https://formspree.io/f/KENDI_ID_NUMARANIZ'
          const FORMSPREE_URL = 'https://formspree.io/f/xjgljrpg'; 

          const formData = new FormData(contactForm);
          const response = await fetch(FORMSPREE_URL, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            statusDiv.textContent = 'Mesajınız başarıyla gönderildi! Size en kısa sürede dönüş yapacağız.';
            statusDiv.classList.add('bg-green-100', 'text-green-700');
            statusDiv.classList.remove('hidden');
            contactForm.reset();
          } else {
            statusDiv.textContent = 'Gönderim sırasında bir hata oluştu. Lütfen Formspree ayarlarınızı kontrol edin.';
            statusDiv.classList.add('bg-red-100', 'text-red-700');
            statusDiv.classList.remove('hidden');
          }
        } catch (error) {
          statusDiv.textContent = 'Bağlantı hatası oluştu. Lütfen tekrar deneyin.';
          statusDiv.classList.add('bg-red-100', 'text-red-700');
          statusDiv.classList.remove('hidden');
        } finally {
          submitBtn.innerHTML = originalBtnText;
          submitBtn.disabled = false;
        }
      });
    }

    window.addEventListener('scroll', () => {
      const nav = document.getElementById('navbar');
      if(window.scrollY > 20) { 
        nav.classList.add('lg:nav-scrolled'); 
        nav.classList.add('bg-white/95');
        nav.classList.remove('lg:nav-transparent', 'border-transparent', 'lg:bg-transparent'); 
      } else { 
        nav.classList.remove('lg:nav-scrolled'); 
        nav.classList.remove('bg-white/95');
        nav.classList.add('lg:nav-transparent', 'border-transparent', 'bg-white/95', 'lg:bg-transparent'); 
      }
    });
  </script>
</body>
</html>
